<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#111a2b" media="(prefers-color-scheme: dark)" />
<title>CardsRef — Cardiology Pocket Reference</title>
<style>
  :root{
    color-scheme: light;
    --bg:#f4f6f8; --surface:#ffffff; --surface-2:#f8fafc;
    --ink:#0f172a; --ink-2:#475569; --ink-3:#64748b;
    --line:#e2e8f0; --line-2:#eef2f6;
    --primary:#0e7490; --primary-ink:#155e75; --primary-tint:#ecfeff;
    --urgent:#dc2626; --urgent-tint:#fef2f2;
    --on-accent:#ffffff;          /* text/icons sitting on a filled primary or urgent button */
    --dot-boost:none;
    --docs:#4f46e5; --workflow:#059669;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.04);
    --radius:16px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --bg:#0b1220; --surface:#111a2b; --surface-2:#0f1826;
      --ink:#e8edf4; --ink-2:#9fb0c4; --ink-3:#7d8ea6;
      --line:#1e293b; --line-2:#182234;
      --primary:#22d3ee; --primary-ink:#67e8f9; --primary-tint:#0d2b33;
      --urgent:#f87171; --urgent-tint:#2a1414;
      /* Accents are LIGHT in dark mode, so text on top of them must be dark. */
      --on-accent:#06141f;
      --dot-boost:brightness(1.45) saturate(.92);
      --docs:#a5b4fc; --workflow:#34d399;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font); background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit; cursor:pointer}
  a{color:var(--primary-ink); text-decoration:none}
  .app{max-width:640px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}

  /* Top bar */
  .top{
    position:sticky; top:0; z-index:20; background:var(--surface);
    padding:calc(var(--safe-top) + 12px) 16px 12px; border-bottom:1px solid var(--line);
  }
  .top-row{display:flex; align-items:center; gap:12px; min-height:34px}
  .back{
    border:none; background:none; color:var(--primary-ink); font-size:16px; font-weight:600;
    padding:6px 6px 6px 0; margin-left:-4px; display:none; align-items:center; gap:4px;
  }
  .back.show{display:inline-flex}
  .brand{font-size:19px; font-weight:800; letter-spacing:-.02em; flex:1; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .brand small{display:block; font-size:11px; font-weight:600; color:var(--ink-3); letter-spacing:.02em}
  .who{
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
    font-size:12px; font-weight:600; padding:6px 10px; border-radius:999px; white-space:nowrap;
  }
  .search{
    margin-top:12px; display:flex; align-items:center; gap:8px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:12px; padding:10px 12px;
  }
  .search input{
    border:none; background:none; outline:none; font-size:16px; color:var(--ink); width:100%;
  }
  .search svg{flex:none; color:var(--ink-3)}
  .search .clear{border:none;background:none;color:var(--ink-3);font-size:18px;padding:0 2px;display:none}
  .search .clear.show{display:block}

  /* Scroll body */
  .scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px 120px}

  /* Home tiles */
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .tile{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; text-align:left; box-shadow:var(--shadow); display:flex; flex-direction:column;
    gap:10px; min-height:120px; transition:transform .12s ease;
  }
  .tile:active{transform:scale(.975)}
  .tile .dot{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
  .tile .dot svg{width:20px;height:20px}
  .tile h3{margin:0; font-size:16px; font-weight:700; letter-spacing:-.01em}
  .tile .count{margin-top:auto; font-size:12px; color:var(--ink-3); font-weight:600}
  .cat-call .dot{background:var(--urgent-tint); color:var(--urgent)}
  .cat-consult .dot{background:var(--primary-tint); color:var(--primary-ink)}
  .cat-docs .dot{background:color-mix(in srgb,var(--docs) 12%,transparent); color:var(--docs)}
  .cat-workflow .dot{background:color-mix(in srgb,var(--workflow) 14%,transparent); color:var(--workflow)}

  .section-label{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-3); margin:22px 4px 10px}

  /* List rows */
  .list{display:flex; flex-direction:column; gap:10px}
  .row{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .row-main{display:flex; align-items:center; gap:12px; padding:14px 14px; width:100%;
    background:none; border:none; text-align:left; color:inherit}
  .row-main:active{background:var(--surface-2)}
  .row-body{flex:1; min-width:0}
  .row-title{font-size:16px; font-weight:700; letter-spacing:-.01em; margin:0}
  .row-sub{font-size:13px; color:var(--ink-2); margin:2px 0 0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .row-cat{font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;
    color:var(--ink-3)}
  .num{font-family:var(--mono); font-size:15px; font-weight:600; letter-spacing:.02em}
  .chev{color:var(--ink-3); flex:none}

  /* Call action row */
  .call-actions{display:flex; border-top:1px solid var(--line-2)}
  .call-actions a, .call-actions button{
    flex:1; border:none; background:none; padding:12px; font-size:14px; font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:7px; color:var(--primary-ink);
    text-decoration:none;
  }
  .call-actions a:active, .call-actions button:active{background:var(--surface-2)}
  .call-actions .call-btn{color:var(--urgent)}
  .call-actions a + button, .call-actions button + a, .call-actions button + button{border-left:1px solid var(--line-2)}

  /* Detail */
  .detail-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:20px; }
  .detail-card h2{margin:0 0 4px; font-size:22px; font-weight:800; letter-spacing:-.02em}
  .detail-sub{color:var(--ink-2); font-size:15px; margin:0 0 16px}
  .contact-grid{display:flex; flex-direction:column; gap:10px; margin:0 0 18px}
  .contact{display:flex; align-items:center; gap:12px; background:var(--surface-2);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px}
  .contact .lbl{font-size:12px; font-weight:700; color:var(--ink-3); text-transform:uppercase;
    letter-spacing:.04em; width:52px; flex:none}
  .contact .val{font-family:var(--mono); font-size:16px; font-weight:600; flex:1}
  .contact .mini{border:none;background:none;color:var(--primary-ink);font-weight:700;font-size:13px;padding:6px}
  .big-call{display:flex; gap:10px; margin:0 0 18px}
  .big-call a, .big-call button{
    flex:1; border:none; border-radius:12px; padding:15px; font-size:16px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:8px; text-align:center;
  }
  .big-call .primary{background:var(--urgent); color:var(--on-accent)}
  .big-call .ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
  .big-call .primary:active,.big-call .ghost:active{filter:brightness(.95)}
  .prose{font-size:15.5px; line-height:1.6; color:var(--ink)}
  .prose p{margin:0 0 12px}
  .prose ul{margin:0 0 12px; padding-left:20px}
  .prose li{margin:0 0 5px}
  .prose a{text-decoration:underline; word-break:break-word}
  .link-out{display:inline-flex; align-items:center; gap:6px; margin-top:6px; background:var(--primary-tint);
    color:var(--primary-ink); font-weight:700; font-size:14px; padding:10px 14px; border-radius:10px}
  .tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:16px}
  .tag{font-size:12px; font-weight:600; color:var(--ink-2); background:var(--surface-2);
    border:1px solid var(--line); border-radius:999px; padding:4px 10px}
  .meta{margin-top:18px; padding-top:14px; border-top:1px solid var(--line-2); font-size:12.5px; color:var(--ink-3)}
  .meta a{color:var(--ink-3); text-decoration:underline}

  .detail-actions{display:flex; gap:10px; margin-top:16px}
  .detail-actions button{flex:1; border-radius:12px; padding:13px; font-size:15px; font-weight:700; border:1px solid var(--line)}
  .btn-edit{background:var(--surface); color:var(--ink)}
  .btn-del{background:var(--urgent-tint); color:var(--urgent); border-color:transparent}

  /* FAB */
  .fab{position:fixed; right:calc(50% - 320px + 20px); bottom:calc(24px + var(--safe-bottom)); z-index:30;
    width:56px; height:56px; border-radius:18px; background:var(--primary); color:var(--on-accent); border:none;
    box-shadow:0 8px 24px rgba(14,116,144,.4); display:flex; align-items:center; justify-content:center}
  .fab:active{transform:scale(.94)}
  @media (max-width:680px){ .fab{right:20px} }

  /* Empty */
  .empty{text-align:center; padding:60px 24px; color:var(--ink-3)}
  .empty svg{opacity:.4; margin-bottom:12px}
  .empty p{margin:0; font-size:15px}

  /* Sheet / modal */
  .sheet-bg{position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:40; opacity:0;
    pointer-events:none; transition:opacity .2s ease; backdrop-filter:blur(2px)}
  .sheet-bg.show{opacity:1; pointer-events:auto}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:50; background:var(--surface);
    border-radius:22px 22px 0 0; max-width:640px; margin:0 auto; max-height:92dvh; overflow-y:auto;
    transform:translateY(100%); pointer-events:none; transition:transform .28s cubic-bezier(.32,.72,0,1);
    padding:8px 18px calc(24px + var(--safe-bottom)); box-shadow:0 -8px 40px rgba(0,0,0,.2)}
  .sheet.show{transform:translateY(0); pointer-events:auto}
  .grab{width:38px; height:5px; background:var(--line); border-radius:999px; margin:8px auto 4px}
  .sheet h3{font-size:19px; font-weight:800; margin:6px 2px 16px}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-2); text-transform:uppercase;
    letter-spacing:.04em; margin-bottom:6px}
  .field input, .field textarea, .field select{
    width:100%; border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    border-radius:11px; padding:12px 13px; font-size:16px; font-family:inherit; outline:none}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary); background:var(--surface)}
  .field textarea{min-height:120px; resize:vertical; line-height:1.5}
  /* Chrome/Safari force their own light autofill background and near-black text,
     which ignores the rules above. Repaint it with an inset shadow. */
  .field input:-webkit-autofill,
  .field input:-webkit-autofill:hover,
  .field input:-webkit-autofill:focus,
  .search input:-webkit-autofill{
    -webkit-text-fill-color:var(--ink);
    caret-color:var(--ink);
    -webkit-box-shadow:0 0 0 1000px var(--surface-2) inset;
    box-shadow:0 0 0 1000px var(--surface-2) inset;
    transition:background-color 9999s ease-in-out 0s;
  }
  .field input::placeholder, .field textarea::placeholder, .search input::placeholder{color:var(--ink-3); opacity:1}
  .field .hint{font-size:12px; color:var(--ink-3); margin-top:5px; font-weight:500; text-transform:none; letter-spacing:0}
  .row2{display:flex; gap:10px}
  .row2 .field{flex:1}
  .sheet-actions{display:flex; gap:10px; margin-top:8px; position:sticky; bottom:0; background:var(--surface);
    padding:12px 0 4px}
  .sheet-actions button{flex:1; border-radius:12px; padding:14px; font-size:16px; font-weight:800; border:none}
  .save{background:var(--primary); color:var(--on-accent)}
  .cancel{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}

  .toast{position:fixed; left:50%; bottom:calc(90px + var(--safe-bottom)); transform:translateX(-50%) translateY(10px);
    background:var(--ink); color:var(--bg); font-size:14px; font-weight:600; padding:11px 18px; border-radius:999px;
    z-index:80; opacity:0; transition:all .22s ease; pointer-events:none; box-shadow:var(--shadow)}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

  .banner{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:11px 13px;
    font-size:12.5px; color:var(--ink-2); line-height:1.5; margin-bottom:16px}
  .banner b{color:var(--ink)}

  .hist{margin-top:6px}
  .hist details{border-top:1px solid var(--line-2); padding-top:12px}
  .hist summary{font-size:12.5px; color:var(--ink-3); font-weight:700; cursor:pointer; list-style:none}
  .hist summary::-webkit-details-marker{display:none}
  .hist ul{list-style:none; padding:0; margin:10px 0 0}
  .hist li{font-size:12.5px; color:var(--ink-2); padding:6px 0; border-bottom:1px solid var(--line-2)}
  .hist li b{color:var(--ink); font-weight:700}

  /* Markdown prose */
  .prose h1,.prose h2,.prose h3,.prose h4{margin:18px 0 8px; font-weight:800; letter-spacing:-.01em; line-height:1.25}
  .prose h1{font-size:20px} .prose h2{font-size:18px} .prose h3{font-size:16px} .prose h4{font-size:14.5px}
  .prose ol{margin:0 0 12px; padding-left:22px}
  .prose ol li{margin:0 0 5px}
  .prose code{font-family:var(--mono); font-size:.88em; background:var(--surface-2); border:1px solid var(--line);
    border-radius:6px; padding:1px 5px}
  .prose pre{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    overflow-x:auto; margin:0 0 12px}
  .prose pre code{background:none; border:none; padding:0; font-size:13px; line-height:1.5}
  .prose blockquote{margin:0 0 12px; padding:2px 14px; border-left:3px solid var(--primary); color:var(--ink-2)}
  .prose hr{border:none; border-top:1px solid var(--line); margin:16px 0}
  .prose strong{font-weight:800} .prose em{font-style:italic} .prose del{opacity:.6}
  .prose a.wikilink{display:inline; text-decoration:none; font-weight:700; color:var(--primary-ink);
    border-bottom:1px solid color-mix(in srgb,var(--primary) 40%,transparent)}
  .prose a.wikilink::before{content:"› "; font-weight:800; opacity:.65}
  .prose a.wikilink.missing{color:var(--urgent); border-bottom:1px dashed color-mix(in srgb,var(--urgent) 50%,transparent)}
  .prose a.wikilink.missing::before{content:"+ "}

  /* Add-category tile */
  .tile .dot{filter:var(--dot-boost)}
  .tile.add{align-items:center; justify-content:center; border-style:dashed; background:var(--surface-2);
    color:var(--ink-3); font-weight:700; gap:8px; text-align:center}
  .tile.add .dot{background:var(--line-2); color:var(--ink-2); filter:none}

  /* Category list header */
  .cat-head{display:flex; align-items:center; gap:10px; margin:22px 4px 12px}
  .cat-head .section-label{margin:0; flex:1}
  .cat-head .gear{border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    border-radius:10px; padding:7px 11px; font-size:13px; font-weight:700; display:inline-flex; align-items:center; gap:6px}

  /* Category editor */
  .icon-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:8px; margin-bottom:6px}
  .icon-opt{aspect-ratio:1; border:1px solid var(--line); background:var(--surface-2); border-radius:11px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-2)}
  .icon-opt svg{width:20px;height:20px}
  .icon-opt.sel{border-color:var(--primary); background:var(--primary-tint); color:var(--primary-ink); box-shadow:0 0 0 1px var(--primary) inset}
  .swatches{display:flex; flex-wrap:wrap; gap:10px}
  .swatch{width:34px;height:34px;border-radius:999px;border:none; box-shadow:0 0 0 2px var(--surface)}
  .swatch.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
  .seg{display:flex; gap:8px}
  .seg button{flex:1; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
    border-radius:11px; padding:11px; font-size:14px; font-weight:700}
  .seg button.sel{border-color:var(--primary); background:var(--primary-tint); color:var(--primary-ink)}
  .cat-tools{display:flex; gap:8px; margin:2px 0 14px}
  .cat-tools button{flex:1; border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    border-radius:11px; padding:11px; font-size:13px; font-weight:700}
  .cat-tools button:disabled{opacity:.4}
  .cat-del{width:100%; border:none; background:var(--urgent-tint); color:var(--urgent); font-weight:800;
    border-radius:12px; padding:13px; font-size:15px; margin-top:4px}

  /* Sign-in controls */
  .oauth-btn{width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
    border-radius:12px; padding:14px; font-size:15px; font-weight:700; margin-bottom:14px}
  .oauth-btn:active{background:var(--surface-2)}
  .or-div{display:flex; align-items:center; gap:12px; margin:0 0 14px; color:var(--ink-3); font-size:13px}
  .or-div::before,.or-div::after{content:""; flex:1; height:1px; background:var(--line)}
  .link-btn{width:100%; border:none; background:none; color:var(--ink-2); font-size:14px;
    font-weight:600; padding:12px 0 2px}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
  :focus-visible{outline:2px solid var(--primary); outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <button class="back" id="backBtn" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </button>
      <div class="brand" id="brandTitle">CardsRef<small id="brandSub">Cardiology Fellows Reference</small></div>
      <button class="who" id="whoBtn">Sign in</button>
    </div>
    <label class="search" id="searchWrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="search" placeholder="Search numbers, questions, docs…" autocomplete="off" enterkeyhint="search" />
      <button class="clear" id="searchClear" aria-label="Clear">&times;</button>
    </label>
  </header>

  <main class="scroll" id="scroll"></main>

  <button class="fab" id="fabBtn" aria-label="Add entry">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<!-- Supabase client (public CDN) + your project config -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
"use strict";
/* ---------- Config + Supabase client ---------- */
const CFG = (typeof window!=="undefined" && window.CARDSREF_CONFIG) || {};
const CONFIGURED = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY
  && !/YOUR[-_]/i.test(CFG.SUPABASE_URL) && !/YOUR[-_]/i.test(CFG.SUPABASE_ANON_KEY)
  && window.supabase && typeof window.supabase.createClient==="function");
const sb = CONFIGURED ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;
let USER = null; // Supabase auth user, or null

function localStorageGet(k){ try{return window.localStorage.getItem(k)||"";}catch(e){return "";} }
function localStorageSet(k,v){ try{window.localStorage.setItem(k,v);}catch(e){} }

/* ---------- Row mappers (DB snake_case <-> app camelCase) ---------- */
function toEntryRow(e){
  return { id:e.id, cat:e.cat, title:e.title||"", subtitle:e.subtitle||"", phone:e.phone||"",
    pager:e.pager||"", ext:e.ext||"", body:e.body||"", url:e.url||"", tags:e.tags||[],
    updated_at:new Date(e.updatedAt||Date.now()).toISOString(), updated_by:e.updatedBy||null,
    history:e.history||[] };
}
function fromEntryRow(r){
  return { id:r.id, cat:r.cat, title:r.title||"", subtitle:r.subtitle||"", phone:r.phone||"",
    pager:r.pager||"", ext:r.ext||"", body:r.body||"", url:r.url||"", tags:r.tags||[],

function timeAgo(ts){
  if(!ts) return "";
  const d=(Date.now()-ts)/1000;
  if(d<60) return "just now";
  if(d<3600) return Math.floor(d/60)+"m ago";
  if(d<86400) return Math.floor(d/3600)+"h ago";
  if(d<604800) return Math.floor(d/86400)+"d ago";
  return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

/* ---------- Markdown ---------- */
function findEntryByTitle(t){
  const n=String(t).trim().toLowerCase();
  return DATA.entries.find(e=>String(e.title).trim().toLowerCase()===n) || null;

function safeUrl(u){
  u=String(u||"").trim();
  if(/^(https?:|mailto:|tel:)/i.test(u)) return u;
  if(/^www\./i.test(u)) return "https://"+u;
  if(/^[/#]/.test(u)) return u;
  return null; // block javascript:, data:, etc.
}
/* Inline formatting: links/wiki-links/code stashed before escaping, then bold/italic applied */
function inlineMd(text){
  const tok=[];
  const stash = html => "\u0000T"+(tok.push(html)-1)+"\u0000";
  // inline code (protect from all other formatting)
  text = text.replace(/`([^`]+)`/g,(m,c)=>stash("<code>"+esc(c)+"</code>"));
  // [[wiki links]] and [[Title|label]] -> in-app subpage navigation
  text = text.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,title,label)=>{
    const t=title.trim(), lbl=(label||title).trim();
    const target=findEntryByTitle(t);
    if(target) return stash(`<a href="#" class="wikilink" data-entry="${esc(target.id)}">${esc(lbl)}</a>`);
    return stash(`<a href="#" class="wikilink missing" data-newpage="${esc(t)}">${esc(lbl)}</a>`);
  });
  // [text](url) external links
  text = text.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,(m,txt,url)=>{
    const safe=safeUrl(url); if(!safe) return esc(txt);
    return stash(`<a href="${esc(safe)}" target="_blank" rel="noopener">${esc(txt)}</a>`);
  });
  // bare URL autolink
  text = text.replace(/(?:https?:\/\/|www\.)[^\s<)]+/g,(m)=>{
    const safe=safeUrl(m); if(!safe) return m;
    return stash(`<a href="${esc(safe)}" target="_blank" rel="noopener">${esc(m)}</a>`);
  });
  // escape whatever text remains
  text = esc(text);
  // emphasis
  text = text.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
             .replace(/__([^_]+)__/g,"<strong>$1</strong>")
             .replace(/~~([^~]+)~~/g,"<del>$1</del>")
             .replace(/\*([^*\n]+)\*/g,"<em>$1</em>")
             .replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g,"$1<em>$2</em>");
  // restore stashed tokens
  return text.replace(/\u0000T(\d+)\u0000/g,(m,n)=>tok[+n]);
}
function renderMarkdown(src){
  if(!src || !src.trim()) return "";
  const lines = src.replace(/\r\n?/g,"\n").split("\n");
  let html="", para=[], i=0;
  const flushP=()=>{ if(para.length){ html+="<p>"+inlineMd(para.join(" "))+"</p>"; para=[]; } };
  while(i<lines.length){
    const line=lines[i];
    // fenced code block
    if(/^\s*```/.test(line)){
      flushP(); i++; const code=[];
      while(i<lines.length && !/^\s*```/.test(lines[i])){ code.push(lines[i]); i++; }
      i++; html+="<pre><code>"+esc(code.join("\n"))+"</code></pre>"; continue;
    }
    // horizontal rule
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ flushP(); html+="<hr>"; i++; continue; }
    // heading
    const h=line.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
    if(h){ flushP(); const l=Math.min(h[1].length,4); html+="<h"+l+">"+inlineMd(h[2].trim())+"</h"+l+">"; i++; continue; }
    // blockquote (recursively render inner content)
    if(/^\s*>\s?/.test(line)){
      flushP(); const q=[];
      while(i<lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      html+="<blockquote>"+renderMarkdown(q.join("\n"))+"</blockquote>"; continue;
    }
    // unordered list
    if(/^\s*[-*+]\s+/.test(line)){
      flushP(); const items=[];
      while(i<lines.length && /^\s*[-*+]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*+]\s+/,"")); i++; }
      html+="<ul>"+items.map(t=>"<li>"+inlineMd(t)+"</li>").join("")+"</ul>"; continue;
    }
    // ordered list
    if(/^\s*\d+[.)]\s+/.test(line)){
      flushP(); const items=[];
      while(i<lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*\d+[.)]\s+/,"")); i++; }
      html+="<ol>"+items.map(t=>"<li>"+inlineMd(t)+"</li>").join("")+"</ol>"; continue;
    }
    // blank line ends a paragraph
    if(line.trim()===""){ flushP(); i++; continue; }
    para.push(line.trim()); i++;
  }
  flushP();
  return html;
}
/* plain-text preview (strip markdown syntax) */
function stripMd(s){
  return String(s||"").replace(/\r?\n/g," ")
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>b||a)
    .replace(/\[([^\]]+)\]\([^)]*\)/g,"$1")
    .replace(/[#>*_`~-]/g," ").replace(/\s+/g," ").trim();
}

function renderSearch(q){
  const frag=document.createDocumentFragment();
  const needle=q.toLowerCase();
  const hits=DATA.entries.filter(e=>{
    return [e.title,e.subtitle,e.body,e.phone,e.pager,e.ext,e.url,(e.tags||[]).join(" ")]
      .join(" ").toLowerCase().includes(needle);
  }).sort((a,b)=>a.title.localeCompare(b.title));
  const label=document.createElement("div");
  label.className="section-label"; label.textContent=`${hits.length} result${hits.length===1?"":"s"}`;
  frag.appendChild(label);
  if(!hits.length){ frag.appendChild(emptyEl("No matches. Try another term — or add it with +.")); return frag; }
  const list=document.createElement("div"); list.className="list";
  hits.forEach(e=>{
    const r=rowEl(e);

      </div>`;
    }
  }

  if(e.body) html+=`<div class="prose">${renderMarkdown(e.body)}</div>`;
  if(e.url) html+=`<a class="link-out" href="${esc(e.url)}" target="_blank" rel="noopener">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>

  if(e.tags && e.tags.length){
    html+='<div class="tags">'+e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")+'</div>';
  }

  html+=`<div class="meta">Last edited ${esc(timeAgo(e.updatedAt))}${e.updatedBy?` by ${esc(e.updatedBy)}`:""}</div>`;
  if(e.history && e.history.length){
    html+=`<div class="hist"><details><summary>Edit history (${e.history.length})</summary><ul>`+
      e.history.slice().reverse().map(h=>`<li><b>${esc(h.by||"someone")}</b> · ${esc(new Date(h.at).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}))}${h.action?" · "+esc(h.action):""}</li>`).join("")+
      `</ul></details></div>`;

  card.innerHTML=html;

  const actions=document.createElement("div");
  actions.className="detail-actions";
  actions.innerHTML=`<button class="btn-edit">Edit</button><button class="btn-del">Delete</button>`;
  actions.querySelector(".btn-edit").onclick=()=> canEdit()?openSheet(e):openSignIn();
  actions.querySelector(".btn-del").onclick=()=> canEdit()?delEntry(e):openSignIn();

  card.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copy(b.getAttribute("data-copy")));
  card.querySelectorAll("a.wikilink[data-entry]").forEach(a=>a.onclick=ev=>{ ev.preventDefault(); go({name:"entry",id:a.getAttribute("data-entry")}); });
  card.querySelectorAll("a.wikilink[data-newpage]").forEach(a=>a.onclick=ev=>{ ev.preventDefault(); if(canEdit()) openSheet(null,{title:a.getAttribute("data-newpage"),cat:e.cat}); else openSignIn(); });

  frag.appendChild(card);
  frag.appendChild(actions);
  return frag;
}
function contactRow(lbl,val){

    <button class="mini" data-copy="${esc(val)}">Copy</button></div>`;
}
function emptyEl(msg){

/* ---------- Navigation (self-contained; no History API) ---------- */
let navStack=[];
let preSearchView=null;
function go(v, replace){
  if(!replace && view) navStack.push(view);
  view=v;
  $("#scroll").scrollTop=0;
  render();
}
function back(){
  if(view && view.name==="search"){ exitSearch(); return; }
  view = navStack.length ? navStack.pop() : {name:"home"};
  $("#scroll").scrollTop=0;
  render();
}
function exitSearch(){
  const t=$("#searchInput"); if(t) t.value="";
  $("#searchClear").classList.remove("show");
  view = preSearchView || {name:"home"}; preSearchView=null;
  render();
}

      <textarea id="f_body" placeholder="Markdown: **bold**, # headings, - bullets, 1. lists, > quotes, [links](https://…), and [[Page Title]] to link another card.">${esc(e.body)}</textarea>
      <div class="hint">**bold** · # heading · - bullet · [links](url) · [[Page Title]] opens another card</div>
    </div>

      <label>Document / link URL <span class="hint" style="display:inline">(optional)</span></label>

  sheet.querySelector("#f_cat").onchange=toggleCall; toggleCall();

function showSheet(){ $("#sheetBg").classList.add("show"); $("#sheet").classList.add("show"); }
function closeSheet(){ $("#sheetBg").classList.remove("show"); $("#sheet").classList.remove("show"); }
$("#sheetBg").onclick=closeSheet;

async function saveFromSheet(e, isNew){
  const g=id=>document.getElementById(id);
  // Gather all field values FIRST (before any modal can replace the sheet)
  const vals={
    cat:g("f_cat").value,
    title:g("f_title").value.trim(),
    subtitle:g("f_subtitle").value.trim(),
    phone:g("f_phone").value.trim(),
    pager:g("f_pager").value.trim(),
    ext:g("f_ext").value.trim(),
    body:g("f_body").value.trim(),
    url:g("f_url").value.trim(),
    tags:g("f_tags").value.split(",").map(t=>t.trim()).filter(Boolean),
  };
  if(!vals.title){ toast("Add a title first"); g("f_title").focus(); return; }
  if(!canEdit()){ openSignIn(); return; }
  const who=editorName();
  const updated={ ...e, ...vals, updatedAt:Date.now(), updatedBy:who };
  updated.history=[...(e.history||[]), {by:who, at:Date.now(), action:isNew?"created":"edited"}].slice(-30);
  try{ await DB.saveEntry(updated); }
  catch(err){ toast("Save failed: "+errMsg(err)); return; }
  const idx=DATA.entries.findIndex(x=>x.id===updated.id);
  if(idx>=0) DATA.entries[idx]=updated; else DATA.entries.push(updated);
  closeSheet();
  go({name:"entry",id:updated.id}, true);
  toast(isNew?"Added":"Saved");
}

function delEntry(e){
  confirmSheet("Delete this entry?", `“${e.title}” will be removed for everyone.`, "Delete").then(async ok=>{
    if(!ok) return;
    try{ await DB.removeEntry(e.id); }
    catch(err){ toast("Delete failed: "+errMsg(err)); return; }
    DATA.entries=DATA.entries.filter(x=>x.id!==e.id);
    go({name:"cat",cat:e.cat}, true);
    toast("Deleted");
  });
}

/* ---------- Auth (magic link) + account ---------- */
function errMsg(e){
  if(!e) return "error";
  try{ console.error("[CardsRef]", e); }catch(_){}
  let s = e.message || e.error_description || e.msg || String(e);
  if(e.code) s = "["+e.code+"] "+s;
  if(e.hint) s += " — "+e.hint;
  if(String(e.code)==="42501") s += " (run fix-grants.sql)";
  return s.length>240 ? s.slice(0,240)+"…" : s;
}
function canEdit(){ return !CONFIGURED || !!USER; }           // preview mode edits locally; live mode needs sign-in
function shortEmail(u){ return u && u.email ? u.email.split("@")[0] : "member"; }
function editorName(){ return EDITOR || (USER ? shortEmail(USER) : "anonymous"); }
async function enforceDomain(){
  if(!sb || !USER || !CFG.ALLOWED_EMAIL_DOMAIN) return true;
  if(domainOk(USER.email)) return true;
  try{ await sb.auth.signOut(); }catch(_){}
  USER=null;
  toast("Only @"+CFG.ALLOWED_EMAIL_DOMAIN+" accounts can edit");
  return false;
}
async function initAuth(){
  if(!sb) return;
  try{ const {data}=await sb.auth.getSession(); USER=(data && data.session)?data.session.user:null; }catch(_){}
  await enforceDomain();
  try{ sb.auth.onAuthStateChange(async(_ev,session)=>{ USER=session?session.user:null; await enforceDomain(); updateAccountUI(); render(); }); }catch(_){}
}
function updateAccountUI(){
  const b=$("#whoBtn"); if(!b) return;
  if(CONFIGURED) b.textContent = USER ? (EDITOR || shortEmail(USER)) : "Sign in";
  else b.textContent = EDITOR || "Preview";
}
$("#whoBtn").onclick=()=>openAccount();

/* Which sign-in methods are enabled (config-driven; magic link is the fallback default) */
function authMethods(){
  const g=!!CFG.AUTH_GOOGLE, ms=!!CFG.AUTH_MICROSOFT, p=!!CFG.AUTH_PASSWORD, m=!!CFG.AUTH_MAGIC_LINK;
  if(!g && !ms && !p && !m) return {google:false, microsoft:false, password:false, magic:true};
  return {google:g, microsoft:ms, password:p, magic:m};
}
function domainOk(email){
  const d=CFG.ALLOWED_EMAIL_DOMAIN;
  if(!d) return true;
  return String(email||"").toLowerCase().endsWith("@"+String(d).toLowerCase());
}
function redirectTo(){ return location.origin+location.pathname; }

function openSignIn(){
  if(!sb){ openAccount(); return; }               // preview mode: no auth backend
  const M=authMethods();
  const sheet=$("#sheet");
  const domainNote = CFG.ALLOWED_EMAIL_DOMAIN ? ` Use your @${esc(CFG.ALLOWED_EMAIL_DOMAIN)} address.` : "";
  const googleBlock = M.google ? `
    <button class="oauth-btn" id="si_google">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.5 1.2-4 1.2-3.1 0-5.700-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.6V6.7H1.4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.7l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>
      Continue with Google
    </button>` : "";
  const microsoftBlock = M.microsoft ? `
    <button class="oauth-btn" id="si_ms">
      <svg viewBox="0 0 23 23" width="17" height="17" aria-hidden="true"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
      Continue with Microsoft
    </button>` : "";
  const divider = ((M.google||M.microsoft) && (M.password || M.magic)) ? `<div class="or-div"><span>or</span></div>` : "";
  const emailBlock = (M.password || M.magic) ? `
    <div class="field">
      <label>Email</label>
      <input id="si_email" inputmode="email" autocomplete="email" placeholder="you@hospital.org" enterkeyhint="${M.password?"next":"send"}" />
    </div>` : "";
  const pwBlock = M.password ? `
    <div class="field">
      <label>Password</label>
      <input id="si_pw" type="password" autocomplete="current-password" placeholder="••••••••" enterkeyhint="go" />
    </div>
    <div class="sheet-actions">
      <button class="cancel" id="si_signup">Create account</button>
      <button class="save" id="si_pwgo">Sign in</button>
    </div>` : "";
  const magicBlock = M.magic ? `
    <div class="sheet-actions">
      ${M.password?"":'<button class="cancel" id="si_cancel">Cancel</button>'}
      <button class="${M.password?"cancel":"save"}" id="si_send" ${M.password?'style="flex:1"':""}>Email me a link</button>
    </div>` : "";
  const closeRow = (!M.magic && M.password) ? "" : "";
  sheet.innerHTML=`
    <div class="grab"></div>
    <h3>Sign in to edit</h3>
    <p style="margin:0 0 16px;color:var(--ink-2);font-size:15px;line-height:1.5">Browsing is open to everyone — signing in is only needed to add or fix a card.${domainNote}</p>
    ${googleBlock}${microsoftBlock}${divider}${emailBlock}${pwBlock}${magicBlock}
    ${(M.password && !M.magic) ? "" : ""}
    <button class="link-btn" id="si_close">Cancel</button>`;

  const getEmail=()=>{ const el=sheet.querySelector("#si_email"); return el?el.value.trim():""; };

  if(M.google){
    sheet.querySelector("#si_google").onclick=async()=>{
      try{
        const opts={ redirectTo:redirectTo() };
        if(CFG.ALLOWED_EMAIL_DOMAIN) opts.queryParams={ hd:CFG.ALLOWED_EMAIL_DOMAIN };
        const {error}=await sb.auth.signInWithOAuth({ provider:"google", options:opts });
        if(error) toast(errMsg(error));
      }catch(err){ toast("Sign-in failed: "+errMsg(err)); }
    };
  }
  if(M.microsoft){
    sheet.querySelector("#si_ms").onclick=async()=>{
      try{
        // Supabase requires the `email` scope for Azure — without it sign-in fails
        // because Auth can't get a verified address back from Entra.
        const opts={ redirectTo:redirectTo(), scopes:"email" };
        const {error}=await sb.auth.signInWithOAuth({ provider:"azure", options:opts });
        if(error) toast(errMsg(error));
      }catch(err){ toast("Sign-in failed: "+errMsg(err)); }
    };
  }
  if(M.password){
    const pwGo=async(mode)=>{
      const email=getEmail(), pw=sheet.querySelector("#si_pw").value;
      if(!/.+@.+\..+/.test(email)){ toast("Enter a valid email"); return; }
      if(!domainOk(email)){ toast("Use your @"+CFG.ALLOWED_EMAIL_DOMAIN+" email"); return; }
      if(pw.length<8){ toast("Password must be at least 8 characters"); return; }
      try{
        const {error} = mode==="signup"
          ? (await sb.auth.signUp({ email, password:pw }))
          : (await sb.auth.signInWithPassword({ email, password:pw }));
        if(error){ toast(errMsg(error)); return; }
        closeSheet();
        toast(mode==="signup" ? "Account created — you're signed in" : "Signed in");
      }catch(err){ toast("Sign-in failed: "+errMsg(err)); }
    };
    sheet.querySelector("#si_pwgo").onclick=()=>pwGo("signin");
    sheet.querySelector("#si_signup").onclick=()=>pwGo("signup");
    sheet.querySelector("#si_pw").addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); pwGo("signin"); } });
  }
  if(M.magic){
    const send=async()=>{
      const email=getEmail();
      if(!/.+@.+\..+/.test(email)){ toast("Enter a valid email"); return; }
      if(!domainOk(email)){ toast("Use your @"+CFG.ALLOWED_EMAIL_DOMAIN+" email"); return; }
      try{
        const {error}=await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo:redirectTo() } });
        if(error){ toast(errMsg(error)); return; }
        closeSheet(); toast("Check your email for the sign-in link");
      }catch(err){ toast("Sign-in failed: "+errMsg(err)); }
    };
    sheet.querySelector("#si_send").onclick=send;
    const c=sheet.querySelector("#si_cancel"); if(c) c.onclick=closeSheet;
    const em=sheet.querySelector("#si_email");
    if(em && !M.password) em.addEventListener("keydown",ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); send(); } });
  }
  sheet.querySelector("#si_close").onclick=closeSheet;
  showSheet();
  setTimeout(()=>{ try{ const em=sheet.querySelector("#si_email"); if(em) em.focus(); }catch(_){} },250);
}
function openAccount(){

function confirmSheet(title, msg, dangerLabel){
  return new Promise(resolve=>{
    const sheet=$("#sheet");
    sheet.innerHTML=`
      <div class="grab"></div>
      <h3>${esc(title)}</h3>

      <div class="sheet-actions">
        <button class="cancel" id="c_cancel">Cancel</button>

/* ---------- Category editor ---------- */
function openCatSheet(cat){
  const isNew=!cat;
  const model = cat ? {...cat} : {id:"cat_"+uid(), name:"", plural:"items", icon:"star", color:CAT_COLORS[cats().length % CAT_COLORS.length], kind:"content"};
  const sheet=$("#sheet");
  const iconGrid = Object.keys(ICONS).map(k=>`<button type="button" class="icon-opt${model.icon===k?" sel":""}" data-icon="${k}">${iconSvg(k)}</button>`).join("");
  const swatches = CAT_COLORS.map(c=>`<button type="button" class="swatch${model.color===c?" sel":""}" data-color="${c}" style="background:${c}" aria-label="color"></button>`).join("");
  const idx = cats().findIndex(c=>c.id===model.id);
  sheet.innerHTML=`
    <div class="grab"></div>
    <h3>${isNew?"New category":"Edit category"}</h3>
    <div class="field">
      <label>Name</label>
      <input id="c_name" value="${esc(model.name)}" placeholder="e.g. Order Sets" />
    </div>
    <div class="field">
      <label>Count label <span class="hint" style="display:inline">(plural noun)</span></label>
      <input id="c_plural" value="${esc(model.plural)}" placeholder="e.g. order sets" />
    </div>
    <div class="field">
      <label>Type</label>
      <div class="seg" id="c_kind">
        <button type="button" data-kind="content" class="${model.kind!=="contact"?"sel":""}">Notes / links</button>
        <button type="button" data-kind="contact" class="${model.kind==="contact"?"sel":""}">Contacts (phone)</button>
      </div>
    </div>
    <div class="field">
      <label>Icon</label>
      <div class="icon-grid" id="c_icons">${iconGrid}</div>
    </div>
    <div class="field">
      <label>Color</label>
      <div class="swatches" id="c_colors">${swatches}</div>
    </div>
    ${isNew?"":`<div class="cat-tools">
      <button type="button" id="c_up" ${idx<=0?"disabled":""}>↑ Move up</button>
      <button type="button" id="c_down" ${idx>=cats().length-1?"disabled":""}>↓ Move down</button>
    </div>`}
    <div class="sheet-actions">
      <button class="cancel" id="c_cancel">Cancel</button>
      <button class="save" id="c_save">${isNew?"Add category":"Save"}</button>
    </div>
    ${isNew?"":`<button class="cat-del" id="c_del">Delete category</button>`}`;
  sheet.querySelectorAll("#c_icons .icon-opt").forEach(b=>b.onclick=()=>{ model.icon=b.dataset.icon; sheet.querySelectorAll("#c_icons .icon-opt").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); });
  sheet.querySelectorAll("#c_colors .swatch").forEach(b=>b.onclick=()=>{ model.color=b.dataset.color; sheet.querySelectorAll("#c_colors .swatch").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); });
  sheet.querySelectorAll("#c_kind button").forEach(b=>b.onclick=()=>{ model.kind=b.dataset.kind; sheet.querySelectorAll("#c_kind button").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); });
  sheet.querySelector("#c_cancel").onclick=closeSheet;
  sheet.querySelector("#c_save").onclick=()=>saveCat(model, isNew);
  if(!isNew){
    const up=sheet.querySelector("#c_up"), down=sheet.querySelector("#c_down"), del=sheet.querySelector("#c_del");
    if(up) up.onclick=()=>moveCat(model.id,-1);
    if(down) down.onclick=()=>moveCat(model.id,1);
    if(del) del.onclick=()=>delCat(model);
  }
  showSheet();
}
async function saveCat(model, isNew){
  const name=$("#c_name").value.trim();
  if(!name){ toast("Name the category"); $("#c_name").focus(); return; }
  if(!canEdit()){ openSignIn(); return; }
  model.name=name;
  model.plural=$("#c_plural").value.trim()||"items";
  if(!DATA.cats || !DATA.cats.length) DATA.cats=DEFAULT_CATS.slice();
  const i=DATA.cats.findIndex(c=>c.id===model.id);
  if(i<0 && model.position==null) model.position=DATA.cats.length;
  try{ await DB.saveCat(model); }
  catch(err){ toast("Save failed: "+errMsg(err)); return; }
  if(i>=0) DATA.cats[i]=model; else DATA.cats.push(model);
  closeSheet();
  go({name:"cat",cat:model.id}, true);
  toast(isNew?"Category added":"Saved");
}
function delCat(model){
  if(cats().length<=1){ toast("Keep at least one category"); return; }
  const n=countIn(model.id);
  const msg = n ? `This category and its ${n} ${n===1?"entry":"entries"} will be removed for everyone.` : "This category will be removed for everyone.";
  confirmSheet("Delete category?", msg, "Delete").then(async ok=>{
    if(!ok) return;
    try{ await DB.removeCat(model.id); }
    catch(err){ toast("Delete failed: "+errMsg(err)); return; }
    if(!DATA.cats) DATA.cats=DEFAULT_CATS.slice();
    DATA.cats=DATA.cats.filter(c=>c.id!==model.id);
    DATA.entries=DATA.entries.filter(e=>e.cat!==model.id);
    closeSheet();
    go({name:"home"}, true);
    toast("Category deleted");
  });
}
async function moveCat(id, dir){
  if(!DATA.cats || !DATA.cats.length) DATA.cats=DEFAULT_CATS.slice();
  const arr=DATA.cats.slice();
  const i=arr.findIndex(c=>c.id===id);
  const j=i+dir;
  if(i<0 || j<0 || j>=arr.length) return;
  const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  arr.forEach((c,k)=>c.position=k);
  try{ await DB.setCatPositions(arr); }
  catch(err){ toast("Reorder failed: "+errMsg(err)); return; }
  DATA.cats=arr;
  openCatSheet(DATA.cats[j]);
}

/* ---------- Copy ---------- */
async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("Copied"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy"); toast("Copied");}catch(_){toast("Copy failed");}
    document.body.removeChild(ta);
  }
}

/* ---------- Search wiring ---------- */
const si=$("#searchInput");
si.addEventListener("input",()=>{
  const q=si.value.trim();
  $("#searchClear").classList.toggle("show", q.length>0);
  if(q){ if(!view || view.name!=="search"){ preSearchView=view||{name:"home"}; } view={name:"search",q}; render(); }
  else { exitSearch(); }
});
$("#searchClear").onclick=()=>{ exitSearch(); si.blur(); };

$("#backBtn").onclick=()=>back();
$("#fabBtn").onclick=()=> canEdit()?openSheet(null):openSignIn();

/* ---------- Realtime: refresh when anyone edits (skips while a sheet is open) ---------- */
let refreshTimer=null;
function scheduleRefresh(){ clearTimeout(refreshTimer); refreshTimer=setTimeout(refreshFromServer, 400); }
async function refreshFromServer(){
  if($("#sheet").classList.contains("show")) return;    // don't disrupt an active edit
  try{
    const {cats:cs, entries:es}=await DB.loadAll();
    if(cs && cs.length) DATA.cats=cs;
    DATA.entries=es||[];
    render();
  }catch(_){}
}
function initRealtime(){
  if(!sb) return;
  try{
    sb.channel("cardsref-changes")
      .on("postgres_changes",{event:"*",schema:"public",table:"entries"}, scheduleRefresh)
      .on("postgres_changes",{event:"*",schema:"public",table:"categories"}, scheduleRefresh)
      .subscribe();
  }catch(_){}
}

/* ---------- Boot: paint instantly, then hydrate from the backend ---------- */
async function boot(){
  EDITOR = localStorageGet("cardsref_editor") || "";
  DATA = { meta:{ title:CFG.APP_TITLE||"CardsRef", sub:CFG.APP_SUBTITLE||"Cardiology Consult Reference" },
           cats:DEFAULT_CATS.slice(), entries:[] };
  view = {name:"home"};
  render();
  await initAuth();
  updateAccountUI();
  try{
    const {cats:cs, entries:es}=await DB.loadAll();
    DATA.cats = (cs && cs.length) ? cs : DEFAULT_CATS.slice();
    DATA.entries = es || [];
    render();
  }catch(err){ toast("Couldn't load data: "+errMsg(err)); }
  initRealtime();
}
window.addEventListener("error", ev=>{ try{ toast("Error: "+((ev.error&&ev.error.message)||ev.message||"script")); }catch(_){} });
boot();
</script>
